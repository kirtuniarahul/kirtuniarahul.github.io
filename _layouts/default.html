<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <canvas id="engineering-canvas" aria-hidden="true"></canvas>

  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">KR</span>
        <span>
          <strong>Kirtunia Rahul</strong>
          <small>Composite Structural Engineer</small>
        </span>
      </a>

      <nav class="main-nav" aria-label="Main navigation">
        <a href="{{ '/education/' | relative_url }}" {% if page.url == '/education/' %}class="active"{% endif %}>Education</a>
        <a href="{{ '/research/' | relative_url }}" {% if page.url == '/research/' %}class="active"{% endif %}>Research Projects</a>
        <a href="{{ '/experience/' | relative_url }}" {% if page.url == '/experience/' %}class="active"{% endif %}>Experience</a>
        <a href="{{ '/publications/' | relative_url }}" {% if page.url == '/publications/' %}class="active"{% endif %}>Publications</a>
      </nav>

      <div class="header-actions">
        <a class="icon-link" href="mailto:kirtunia_rahul1@alumni.baylor.edu">Email</a>
        <a class="icon-link" href="https://www.linkedin.com/in/kirtunia-rahul" target="_blank" rel="noopener">LinkedIn</a>
      </div>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <div>
        <strong>Kirtunia Rahul, Ph.D.</strong>
        <span>Composite structures · FEA · manufacturing · research</span>
      </div>
      <div>
        <a href="mailto:kirtunia_rahul1@alumni.baylor.edu">kirtunia_rahul1@alumni.baylor.edu</a>
      </div>
    </div>
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
